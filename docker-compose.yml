services:
  postgres:
    image: postgres:16-alpine
    container_name: pm-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pm_db}
      POSTGRES_USER: ${POSTGRES_USER:-pm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pm_password}
    ports:
      # Expose on 5433 on the host to avoid collisions with local PostgreSQL on 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pm_user} -d ${POSTGRES_DB:-pm_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pm-service-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Apply DB migrations, then start the server
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pm_user}:${POSTGRES_PASSWORD:-pm_password}@postgres:5432/${POSTGRES_DB:-pm_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-compose-jwt-secret-key-replace-in-production}
      LAMBDA_CALLBACK_SECRET: ${LAMBDA_CALLBACK_SECRET:-compose-lambda-secret-replace-in-production}
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /app/data/storage
      AWS_REGION: eu-central-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET_NAME: pm-documents
      PROJECT_SIZE_LIMIT_BYTES: 52428800
      MAX_FILE_SIZE_BYTES: 52428800
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/data/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  localstack:
    image: localstack/localstack:3.8
    container_name: pm-service-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,lambda
      - AWS_DEFAULT_REGION=eu-central-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh:ro
      - ./lambdas:/opt/lambdas:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  storage_data:
  localstack_data:
