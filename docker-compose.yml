services:
  postgres:
    image: postgres:16-alpine
    container_name: pm-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pm_db}
      POSTGRES_USER: ${POSTGRES_USER:-pm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pm_password}
    ports:
      # Expose on 5433 on the host to avoid collisions with local PostgreSQL on 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pm_user} -d ${POSTGRES_DB:-pm_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pm-service-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pm_user}:${POSTGRES_PASSWORD:-pm_password}@postgres:5432/${POSTGRES_DB:-pm_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-compose-jwt-secret-key-replace-in-production}
      LAMBDA_CALLBACK_SECRET: ${LAMBDA_CALLBACK_SECRET:-compose-lambda-secret-replace-in-production}
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /app/data/storage
      PROJECT_SIZE_LIMIT_BYTES: 52428800
      MAX_FILE_SIZE_BYTES: 52428800
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/data/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  storage_data:
