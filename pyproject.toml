[project]
name = "pm-service"
version = "0.1.0"
description = "Project management service with REST API, PostgreSQL, and AWS S3/Lambda"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "EPAM Student Developer" },
]
keywords = [
    "fastapi",
    "postgresql",
    "sqlalchemy",
    "project-management",
    "s3",
    "aws-lambda",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "pyjwt[crypto]>=2.9.0",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.12",
    "boto3>=1.43.127",
]

[project.urls]
Homepage = "https://github.com/example/pm-service"
Repository = "https://github.com/example/pm-service"
Documentation = "https://github.com/example/pm-service#readme"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
    "tox>=4.0.0",
    "boto3-stubs[s3]>=1.43.127",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "lambdas"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "T20",    # flake8-print (prevent print statements in production code)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T201"]  # print statements allowed in tests
"src/app/db/migrations/*" = ["E501"]  # autogenerated migrations may exceed standard line length

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
mypy_path = "src"
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --tb=short --cov=src/app --cov-report=term-missing --cov-fail-under=85"
