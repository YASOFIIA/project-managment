[tox]
min_version = 4.0
env_list = py312, lint, typecheck
isolated_build = true

[testenv]
description = Run pytest test suite with coverage enforcement
deps =
    pytest>=8.3.0
    pytest-cov>=5.0.0
    httpx>=0.27.0
commands =
    pytest {posargs}

[testenv:lint]
description = Run ruff linter and formatting checks
skip_install = true
deps =
    ruff>=0.6.0
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
description = Run mypy static type checking
deps =
    mypy>=1.11.0
    pydantic>=2.8.0
    pydantic-settings>=2.4.0
    sqlalchemy>=2.0.32
    fastapi>=0.115.0
commands =
    mypy src lambdas tests
